[project]
name = "ghrm-bench"
version = "0.1.1"
description = "ASV benchmark harness for ghrm"
requires-python = ">=3.10"
dependencies = [
  "asv>=0.6.5,<0.7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.18",
]

[tool.ty.src]
include = ["benchmarks", "report.py", "scripts"]
respect-ignore-files = true
