[workspace]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
gix = { version = "0.86", default-features = false }

[package]
name = "ghrm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast local GitHub-flavored Markdown and repository browser"
repository = "https://github.com/brege/ghrm"
readme = "README.md"
keywords = ["github", "markdown", "preview", "offline"]
categories = ["command-line-utilities", "text-processing"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/askama.toml",
  "/assets/config.json",
  "/assets/sri.json",
  "/assets/css/**",
  "/assets/img/**",
  "/assets/js.sha256.json",
  "/assets/js.tar.zst",
  "/assets/templates/**",
  "/build.rs",
  "/config.example.toml",
  "/lua/**",
  "/resources/**",
  "/smoke/**",
  "/src/**",
]

[[bin]]
name = "ghrm"
path = "src/main.rs"

[features]
default = ["archive", "content-search", "edit", "gist", "repo", "stats", "watch"]
archive = ["dep:zip"]
content-search = ["dep:grep-matcher", "dep:grep-regex", "dep:grep-searcher"]
edit = []
gist = ["dep:filetime"]
repo = ["dep:gix"]
stats = ["repo", "dep:askalono", "dep:onefetch-manifest", "dep:tokei"]
watch = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
comrak = { version = "0.54", default-features = false, features = ["shortcodes"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
filetime = { version = "0.2", optional = true }
html-escape = "0.2"
lol_html = "3"
content_inspector = "0.2"
infer = { version = "0.22", default-features = false }
bytecount = "0.6"
directories = "6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
webbrowser = { version = "1", features = ["hardened"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "time", "io-util", "net"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io-util"] }

notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.7", optional = true }
ignore = "0.4"
same-file = "1"
unicase = "2"
grep-matcher = { version = "0.1", optional = true }
grep-regex = { version = "0.1", optional = true }
grep-searcher = { version = "0.1", optional = true }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
include_dir = "0.7"
askama = "0.16"
tar = { version = "0.4", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
zstd = "0.13"
hmac = "0.13"
form_urlencoded = "1"
percent-encoding = "2"
sha2 = "0.11"
base64 = "0.23"
gix = { workspace = true, optional = true, features = ["blob-diff", "index", "max-performance-safe", "revision", "sha1", "status"] }
askalono = { version = "0.5", optional = true }
onefetch-manifest = { version = "2.27.1", optional = true }
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
tokei = { version = "14", optional = true }

[dev-dependencies]
gix = { workspace = true, features = ["tree-editor", "sha1"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
